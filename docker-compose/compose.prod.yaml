name: hydacon-production

services:
  api:
    image: hydacon-server:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: never
    container_name: hydacon-api
    restart: unless-stopped
    env_file:
      - /opt/hydacon/.env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:5000:3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /hydacon/production
        awslogs-stream: hydacon-api
        mode: non-blocking
        max-buffer-size: 4m

  redis:
    image: redis:7.4-alpine
    container_name: hydacon-redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in /opt/hydacon/.env}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /hydacon/production
        awslogs-stream: hydacon-redis
        mode: non-blocking
        max-buffer-size: 4m

volumes:
  redis_data:
    name: hydacon_redis_data
