name: CI

on:
  push:
    branches: ["main", "production", "development"]
  pull_request:
    branches: ["main", "production", "development"]

jobs:
  test:
    name: Run Unit Test's
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"
          cache-dependency-path: yarn.lock
      - name: Install Dependencies
        run: yarn install
      - name: Run Tests
        env:
          MONGODB_URL: mongodb://127.0.0.1:27017
        run: npx jest --ci --runInBand
