name: CI

on:
  push:
    branches: ["main", "production", "development"]
  pull_request:
    branches: ["main", "production", "development"]

jobs:
  test:
    name: Run Unit Test's
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"
          cache-dependency-path: yarn.lock
      - name: Install Dependencies
        run: yarn install
      - name: Start MongoDB replica set
        run: |
          docker run --detach --name hydacon-mongodb --publish 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all

          for attempt in {1..30}; do
            if docker exec hydacon-mongodb mongosh --quiet --eval 'db.adminCommand("ping").ok' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          docker exec hydacon-mongodb mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'

          for attempt in {1..30}; do
            if docker exec hydacon-mongodb mongosh --quiet --eval 'rs.status().myState === 1' | grep -q true; then
              exit 0
            fi
            sleep 1
          done

          echo "MongoDB replica set did not become primary" >&2
          exit 1
      - name: Run Tests
        env:
          MONGODB_URL: mongodb://127.0.0.1:27017?replicaSet=rs0
        run: npx jest --ci --runInBand
