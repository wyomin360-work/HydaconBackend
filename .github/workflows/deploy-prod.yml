name: Deploy production

on:
  push:
    branches:
      - production

permissions:
  contents: read

jobs:
  # test:
  #   name: Run tests
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Check out the backend
  #       uses: actions/checkout@v4

  #     - name: Set up Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: yarn
  #         cache-dependency-path: yarn.lock

  #     - name: Install dependencies
  #       run: yarn install

  #     - name: Run tests
  #       run: npx jest --ci --runInBand

  deploy-production:
    name: Build and deploy production
    # needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_ALLOWED_ACCOUNT_IDS: ${{ secrets.AWS_ALLOWED_ACCOUNT_IDS }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECR_REPOSITORY: production
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

    steps:
      - name: Check out the backend
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ALLOWED_ACCOUNT_IDS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy through Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          COMPOSE_B64=$(base64 -w0 docker-compose/compose.prod.yaml)

          SSM_SCRIPT=$(cat <<EOF
          set -e
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          install -d -m 755 /opt/hydacon
          printf '%s' "$COMPOSE_B64" | base64 --decode > /opt/hydacon/compose.prod.yaml
          chmod 644 /opt/hydacon/compose.prod.yaml
          docker compose version
          export ECR_REGISTRY="$ECR_REGISTRY"
          export ECR_REPOSITORY="$ECR_REPOSITORY"
          export IMAGE_TAG="$GITHUB_SHA"
          docker pull "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" "hydacon-server:$GITHUB_SHA"
          COMPOSE_LABEL=\$(docker inspect --format '{{if index .Config.Labels "com.docker.compose.project"}}yes{{end}}' hydacon-api 2>/dev/null || true)
          if [ -z "\$COMPOSE_LABEL" ]; then
            docker rm -f hydacon-api >/dev/null 2>&1 || true
          fi
          docker compose --env-file /opt/hydacon/.env -f /opt/hydacon/compose.prod.yaml config --quiet
          docker compose --env-file /opt/hydacon/.env -f /opt/hydacon/compose.prod.yaml up -d --remove-orphans
          EOF
          )

          PARAMETERS=$(jq -cn --arg script "$SSM_SCRIPT" '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Hydacon API ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
